# Release pipeline: tag on main -> CLI archives (incl. Windows), macOS
# .app/.dmg, GHCR image -> GitHub Release with SHA256SUMS.
#
# Main is only reachable through the ruleset's required checks, so a tag on
# main is a tag on green code; `verify` refuses anything else.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.3.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # A dispatch runs on a branch, so github.ref_name would be the branch name;
  # the input wins when present.
  TAG: ${{ inputs.tag || github.ref_name }}
  GO_VERSION: ${{ vars.GO_VERSION || 'stable' }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is semver and on main
        id: check
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]."
            exit 1
          fi
          sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" || {
            echo "::error::Tag '$TAG' does not exist."
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Tag '$TAG' (${sha:0:12}) is not on main. Release only commits that passed the main ruleset."
            exit 1
          fi
          prerelease=false
          [[ "$TAG" =~ -(rc|alpha|beta) ]] && prerelease=true
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  build-cli:
    name: Build CLI archives
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and package every target
        run: scripts/ci/cross-build.sh --package "$TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: dist/
          retention-days: 7

  build-macos-app:
    name: Build macOS .app + .dmg
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Import the Developer ID Application certificate into a temporary
      # keychain so codesign can find it. Skipped when secrets are unset
      # (build will fall back to ad-hoc signing).
      - name: Import code signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Decode the .p12 from the base64 secret
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Create a fresh keychain just for this run
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the new keychain the default search target so codesign sees it
          # shellcheck disable=SC2046 # word-splitting the keychain list is intended
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Import the cert and authorize codesign to use it without prompting
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify the identity is now visible
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Clean up the decoded .p12 immediately
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build macOS app + DMG
        env:
          # RELEASE=1 is required: without it build.sh deliberately stamps the
          # dev bundle id (com.openmessage.app.dev) and emits OpenMessage-dev.dmg,
          # so a stale dev build can never shadow the installed app in
          # LaunchServices. Shipping artifacts must carry the real id.
          RELEASE: "1"
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: bash macos/build.sh

      - name: Verify release bundle identity
        run: |
          plist=macos/build/OpenMessage.app/Contents/Info.plist
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          echo "Built bundle id: $id, name: $name"
          if [ "$id" != "com.openmessage.app" ] || [ "$name" != "OpenMessage" ]; then
            echo "::error::Release build has id '$id' / name '$name', expected com.openmessage.app / OpenMessage."
            echo "::error::RELEASE=1 was not honored — refusing to ship a dev-identity build."
            exit 1
          fi
          test -f macos/build/OpenMessage.dmg || {
            echo "::error::macos/build/OpenMessage.dmg missing (dev builds emit OpenMessage-dev.dmg)."
            exit 1
          }

      - name: Verify notarization
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        run: |
          spctl --assess --type install --verbose macos/build/OpenMessage.dmg || {
            echo "::warning::DMG did not pass Gatekeeper assessment"
            exit 0
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg
          path: macos/build/OpenMessage.dmg
          retention-days: 7

  container:
    name: Publish container image
    needs: [verify, build-cli, build-macos-app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest only moves on full releases.
          flavor: latest=${{ needs.verify.outputs.prerelease != 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }},enable=${{ needs.verify.outputs.prerelease != 'true' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.verify.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub Release
    needs: [verify, build-cli, build-macos-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) -exec cp {} release/ \;
          # Checksums for verification + Homebrew/Scoop manifests.
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenMessage ${TAG}" \
              --generate-notes \
              --verify-tag \
              --prerelease="$PRERELEASE"
          fi
